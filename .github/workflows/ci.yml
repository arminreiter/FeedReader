name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ponytail: Linux only (net8.0 tests); add a windows-latest job if the net462 build needs CI coverage
      - name: Test
        run: dotnet test FeedReader.Tests
